name: Деплой на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права нужны самому Pages: выложить артефакт и подтвердить деплой.
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: последний коммит всегда важнее предыдущего.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Проверки и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Сборка не должна выкладываться, если проверки не прошли.
      - name: Линтер
        run: npm run lint

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
